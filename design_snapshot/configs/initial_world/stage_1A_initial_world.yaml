runtime_initialization_policy:
  mapping_config_ref: ../core/new_game_builder_mapping.yaml
  mapping_id: stage_1A_new_game_builder_mapping
  new_game_builder_required: true
  new_game_builder_output: SaveFile
  no_implicit_defaults: true
  savefile_schema_ref: schemas/save_file.schema.json
  mapping_coverage_required: Every SaveFile property must have a direct_map, renamed_map,
    expanded_ref, generated, constant, default_empty, or default_null rule.
  validation_steps:
  - load_active_profile_and_compute_effective_feature_flags
  - validate_initial_world_against_initial_world_schema
  - load_new_game_builder_mapping
  - verify_all_savefile_required_fields_covered
  - verify_all_source_paths_and_refs_exist
  - build_savefile_fields_by_mapping_rules
  - expand_initial_tools_ref_to_tools_state
  - expand_initial_facilities_ref_to_facilities_state
  - expand_initial_fuel_ref_to_fuel_state
  - validate_built_savefile_against_save_file_schema
  - emit_new_game_builder_mapping_audit
  generated_field_policy:
    save_version: constant from mapping
    game_version: generated from rule_versions.version_bundle.game_version
    created_with_build: runtime build id
    last_saved_with_build: runtime build id
    created_at_real_time: runtime ISO-8601 time
    last_saved_at_real_time: runtime ISO-8601 time
    random_state: NewGameBuilder deterministic random state factory
    feature_flags: effective flags from active stage profile
    empty_collections: must be emitted explicitly, never omitted
    storage_containers: generated from initial_world.storage_containers, then reconciled
      from every storable runtime object with storage_ref and storage_footprint after
      all active overlays are merged; current Stage 1A storable types are MaterialLot
      and DishLot
    inventory: generated from initial_world.initial_inventory plus active overlay
      inventory additions when a higher stage explicitly enables them; MaterialLot
      entries participate in StorageOccupant reconciliation
    orders: generated from initial_world.initial_orders plus active overlay debug_orders
      when a debug profile explicitly enables them
    family_state: generated from initial_world.family_state plus active overlay family_meal_state
      mapped to SaveFile.family_state.meal_state when Stage 1B or later is active
    crop_instances: default empty list; plant_crop creates CropInstance and field
      active_crop_ids indexes it
    reservations: default empty list; only cross-action/cross-save reservations persist
      here
    dish_lots: default empty list; cook_dish creates DishLot entries and those entries
      participate in the same StorageOccupant reconciliation as MaterialLot
  expanded_ref_policy:
    initial_tools_ref: must resolve to a non-empty initial_tools list and emit SaveFile.tools_state
    initial_facilities_ref: must resolve to a non-empty initial_facilities list and
      emit SaveFile.facilities_state
    initial_fuel_ref: must resolve to a non-empty initial_fuel object and emit SaveFile.fuel_state
  expanded_ref_output_schema_policy:
    tools_state: schemas/tool_state.schema.json
    facilities_state: schemas/facility_state.schema.json
    fuel_state: schemas/fuel_state.schema.json
    validation_required: NewGameBuilder must validate every expanded runtime state
      entry against its schema before SaveFile validation.
  tools_and_facilities_state_semantics:
    quality_tier: crude/basic/fine/masterwork craftsmanship tier only
    condition: usable/worn/damaged wear condition; quality_tier stores craftsmanship
      tier only
    status: availability state such as available/broken/locked/disabled
  default_dish_storage_ref:
    location_id: home
    storage_type: room_temp
    container_id: home_room_temp_01
  cook_dish_output_storage_policy: cook_dish may pass target_storage_ref; if omitted,
    NewGameBuilder/runtime uses default_dish_storage_ref. DishLot storage_ref must
    be filled before ActionResult is returned.
  overlay_merge_policy:
    stage_1B_life_overlay.family_meal_state: merge into SaveFile.family_state.meal_state
      when Stage 1B profile is active
    stage_1C_debug_overlay.debug_inventory_additions: append to SaveFile.inventory
      before storage reconciliation when Stage 1C debug profile is active
    stage_1C_debug_overlay.debug_orders: append to SaveFile.orders when Stage 1C debug
      profile is active
    post_merge_storage_reconciliation: rebuild StorageContainer.active_object_refs
      and used_capacity from merged SaveFile inventory plus dish_lots storable objects;
      validate container existence, slot_weight unit, capacity overflow, and object-type/id
      uniqueness
  storage_occupant_policy:
    storable_object_types_current_stage:
    - MaterialLot
    - DishLot
    object_ref_cache_field: StorageContainer.active_object_refs
    capacity_cache_field: StorageContainer.used_capacity
    storage_source: all SaveFile runtime objects whose schema requires storage_ref
      and storage_footprint
    object_id_fields:
      MaterialLot: lot_id
      DishLot: dish_lot_id
    capacity_rule: sum slot_weight storage_footprint.amount across all active StorageOccupants
      referencing the container
    material_lot_view_rule: MaterialLot-specific views may be derived for UI/debug, but
      the persisted storage cache authority is active_object_refs over all StorageOccupants.
  action_pipeline_storage_invariant:
    applies_to_actions:
    - harvest_crop
    - store_item
    - split_lot
    - start_processing
    - collect_processing_result
    - cook_dish
    - submit_order
    post_success_rule: after every successful storage-mutating action, rebuild or
      incrementally update active_object_refs and used_capacity from StorageOccupants
      and then validate against full reconciliation
    rollback_rule: if an action fails after reserving, consuming, creating, moving,
      or storing an object, restore inventory, dish_lots, reservations, fuel_state,
      orders, storage_containers, and domain_events to the pre-action transaction
      snapshot
    event_rule: domain_events are committed only after storage and object lifecycle
      validation succeeds
