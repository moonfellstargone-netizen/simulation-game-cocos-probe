  aroma:
    type: number
    min: 0
    max: 100
    default: 0
    meaning: 香气
    available_from_stage: stage_1A
    stage_1A_usage: stored_or_hidden_property_not_required_for_main_score
  sweetness:
    type: number
    min: 0
    max: 100
    default: 0
    meaning: 甜味
    available_from_stage: stage_2
  acidity:
    type: number
    min: 0
    max: 100
    default: 0
    meaning: 酸味
    available_from_stage: stage_2
  umami:
    type: number
    min: 0
    max: 100
    default: 0
