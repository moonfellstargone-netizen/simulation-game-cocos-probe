property_definitions:
  freshness:
    type: number
    min: 0
    max: 100
    default: 100
    meaning: 新鲜度
    available_from_stage: stage_1A
  moisture:
    type: number
    min: 0
    max: 100
    default: 50
    meaning: 含水量
    available_from_stage: stage_1A
  cleanliness:
    type: number
    min: 0
    max: 100
    default: 70
    meaning: 清洁度
    available_from_stage: stage_1A
  damage:
    type: number
    min: 0
    max: 100
    default: 0
