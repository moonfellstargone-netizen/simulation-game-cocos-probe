    available_from_stage: stage_1A
  microbial_risk:
    type: number
    min: 0
    max: 100
    default: 0
    meaning: 腐败/微生物风险
    available_from_stage: stage_1A
  safety_risk:
    type: number
    min: 0
    max: 100
    default: 0
    meaning: 食用安全风险
    available_from_stage: stage_1A
  salinity:
    type: number
    min: 0
    max: 100
    default: 0
