name: PR Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  q-full:
    name: q-full (Ubuntu)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out PR merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        id: install
        run: npm ci
      - name: Run full quality gate
        id: quality
        run: npm run q:full
      - name: Preserve quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/quality/latest.json
            reports/quality/latest.md
          if-no-files-found: error
          retention-days: 7
